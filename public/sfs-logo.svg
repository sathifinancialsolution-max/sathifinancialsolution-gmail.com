<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <!-- Golden gradient for the dynamic rising arrow -->
    <linearGradient id="goldGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C28F30" />
      <stop offset="40%" stop-color="#DDAF4B" />
      <stop offset="80%" stop-color="#F2CB6C" />
      <stop offset="100%" stop-color="#DDAF4B" />
    </linearGradient>
    <!-- Darker gold facet for 3D arrow effect -->
    <linearGradient id="goldFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AA7722" />
      <stop offset="100%" stop-color="#8F6014" />
    </linearGradient>
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- 1. Graphic Emblem -->
  <g id="emblem" transform="translate(0, 5)">
    <!-- Bar 1: Leftmost Ochre / Gold Bar -->
    <rect x="130" y="62" width="22" height="46" rx="2" fill="#C6933A" />

    <!-- Bar 2: Navy Bar -->
    <rect x="157" y="38" width="24" height="70" rx="2" fill="#0E2C58" />

    <!-- Bar 3: Center Gold Bar -->
    <rect x="186" y="22" width="24" height="86" rx="2" fill="#C6933A" />

    <!-- Bar 4: Right Navy Bar with diagonal cut at top -->
    <polygon points="215,44 239,32 239,108 215,108" fill="#0E2C58" />

    <!-- Outer White Cutout Mask / Border for Checkmark Arrow to create clean separation -->
    <path
      d="M130 68 L170 94 L224 40 L220 32 L254 12 L248 48 L240 40 L174 105 L124 74 Z"
      fill="#FFFFFF"
    />

    <!-- Overlaid Golden Checkmark & Rising Arrow -->
    <g filter="url(#subtleDrop)">
      <!-- Left Stem of Checkmark -->
      <polygon
        points="132,70 171,94 179,83 140,59"
        fill="url(#goldGradient)"
      />
      <!-- Rising Shaft of Checkmark -->
      <polygon
        points="164,88 238,20 252,32 178,100"
        fill="url(#goldGradient)"
      />
      <!-- Arrow Head Main Body -->
      <polygon
        points="224,30 262,4 246,46 238,36"
        fill="url(#goldGradient)"
      />
      <!-- Arrow Head 3D Bevel Facet -->
      <polygon
        points="262,4 246,46 238,36"
        fill="url(#goldFacet)"
        opacity="0.35"
      />
    </g>
  </g>

  <!-- 2. Brand Name: SFS -->
  <text
    x="200"
    y="174"
    text-anchor="middle"
    font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="62"
    letter-spacing="-1"
    fill="#0E2C58"
  >SFS</text>

  <!-- 3. English Full Name: SATHI FINANCIAL SOLUTION -->
  <text
    x="200"
    y="204"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', 'Outfit', system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="16.5"
    letter-spacing="2.2"
    fill="#0E2C58"
  >SATHI FINANCIAL SOLUTION</text>

  <!-- 4. Crisp Black / Dark Navy Rule -->
  <line
    x1="55"
    y1="213"
    x2="345"
    y2="213"
    stroke="#0E2C58"
    stroke-width="3"
    stroke-linecap="square"
  />

  <!-- 5. Bengali Full Name: সাথি ফাইন্যান্সিয়াল সলিউশনস -->
  <text
    x="200"
    y="241"
    text-anchor="middle"
    font-family="'Noto Sans Bengali', 'SolaimanLipi', system-ui, -apple-system, sans-serif"
    font-weight="700"
    font-size="18.5"
    letter-spacing="0.4"
    fill="#0E2C58"
  >সাথি ফাইন্যান্সিয়াল সলিউশনস</text>
</svg>
